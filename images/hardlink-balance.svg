  <!-- Left chain -->
  <line x1="16" y1="22" x2="16" y2="33" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2,1.5"/>
  <!-- Right chain -->
  <line x1="48" y1="22" x2="48" y2="33" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="2,1.5"/>
  <!-- Left pan -->
  <path d="M9 35 Q16 41 23 35 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.2"/>
  <!-- Right pan -->
